{% comment %}ตัวช่วยให้ dropdown (select2) ค้นหาง่าย — ใช้ร่วมกันหลายหน้า (editMA, editCL)
include หลัง <script select2.full.min.js> แล้วเรียก:
  initSearchSelect('#id_x', 'placeholder', allowClear)          — select ปกติ (ค้นในตัวเลือกที่มีอยู่)
  initSearchSelect('#id_x', 'placeholder', allowClear, {ajax:…}) — ส่ง option เพิ่มของ select2 ได้ (เช่น ajax)
ความสามารถ:
  - เปิด dropdown แล้วโฟกัสช่องค้นหาทันที (select2 4.0.13 + jQuery 3.6 ไม่โฟกัสให้เอง)
  - ค้นได้หลายคำ ไม่สนลำดับ และค้นด้วยรหัส (value) ได้ เช่น "สม แก้ว" เจอ "พ.ต.อ.สมยศ แก้วบังเกิด"
  - ไฮไลต์คำที่ค้นในผลลัพธ์{% endcomment %}
<style>
.select2-container .select2-selection__placeholder{color:#9aa0a6;}
.select2-search--dropdown .select2-search__field{padding:6px 8px;border-radius:4px;}
.select2-results__option mark.s2-hit{background:#fff3bf;padding:0;color:inherit;}
.select2-results__option--highlighted mark.s2-hit{background:#ffe066;color:#212529;}
.select2-results > .select2-results__options{max-height:300px;}
.select2-results__option .s2-sub{display:block;font-size:.78em;color:#6c757d;line-height:1.3;}
.select2-results__option--highlighted .s2-sub{color:#e9ecef;}
</style>
<script>
    function s2EscHtml(s){ return $('<div>').text(s == null ? '' : s).html(); }
    function s2Terms(term){ return $.trim(term || '').toLowerCase().split(/\s+/).filter(Boolean); }

    // ไฮไลต์คำค้นใน text (คืนค่าเป็น HTML ที่ escape แล้ว)
    function s2Highlight(text, terms){
        var html = s2EscHtml(text);
        $.each(terms || [], function(_, t){
            var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
            html = html.replace(re, '<mark class="s2-hit">$1</mark>');
        });
        return html;
    }

    // ทุกคำต้องเจอในข้อความหรือรหัส (ไม่สนลำดับ)
    function s2MultiWordMatcher(params, data){
        var terms = s2Terms(params.term);
        if (!terms.length) return data;
        if (!data.id) return null;   // ไม่แสดงตัวเลือกว่างตอนค้นหา
        var hay = (data.text + ' ' + data.id).toLowerCase();
        for (var i = 0; i < terms.length; i++){
            if (hay.indexOf(terms[i]) === -1) return null;
        }
        return data;
    }

    // เปิด dropdown แล้วโฟกัสช่องค้นหา
    function s2AutoFocus($el, hint){
        $el.on('select2:open', function(){
            setTimeout(function(){
                var f = document.querySelector('.select2-container--open .select2-search__field');
                if (f){ if (hint) f.placeholder = hint; f.focus(); }
            }, 0);
        });
    }

    function initSearchSelect(sel, placeholder, allowClear, extra){
        var $el = $(sel);
        if (!$el.length) return $el;
        var lastTerms = [];
        var opts = $.extend({
            width: '100%',
            placeholder: placeholder,
            allowClear: !!allowClear,
            matcher: function(params, data){ lastTerms = s2Terms(params.term); return s2MultiWordMatcher(params, data); },
            templateResult: function(data){
                if (!data.id || data.loading) return data.text;
                return $('<span>').html(s2Highlight(data.text, lastTerms));
            },
            language: {
                noResults: function(){ return 'ไม่พบรายการที่ค้นหา'; },
                searching: function(){ return 'กำลังค้นหา…'; },
                inputTooShort: function(a){ return 'พิมพ์อีก ' + (a.minimum - a.input.length) + ' ตัวอักษร'; }
            }
        }, extra || {});
        $el.select2(opts);
        s2AutoFocus($el, (extra && extra.searchHint) || 'พิมพ์เพื่อค้นหา…');
        return $el;
    }
</script>
