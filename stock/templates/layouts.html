        /* ปุ่ม export Excel: ไอคอน Excel อยู่หน้าชื่อปุ่ม (ย้าย <i class="fa-file-excel"> มาไว้หน้าด้วย order) จึงไม่ต้องแก้ markup
           สีของแต่ละปุ่มกำหนดผ่าน --xl ใน style ของปุ่ม เช่น style="--xl:#24493d" (ไม่กำหนด = เขียว Excel) */
        .btn-excel {
            --xl: #1d6f42;
            position: relative; overflow: hidden;
            display: inline-flex; align-items: stretch; gap: .5rem;
            padding: 0 .95rem 0 0; border: 0; border-radius: .4rem;
            background: var(--xl); color: #fff !important; font-weight: 600; line-height: 1.3;
            transition: filter .15s;
        }
        .btn-excel:hover, .btn-excel:focus { filter: brightness(1.1); color: #fff; text-decoration: none; }
        .btn-excel:active { filter: brightness(.95); }
        .btn-excel:disabled { opacity: .8; }
        .btn-excel, .btn-excel span[id$="_btn-text"] { align-items: center; }
        .btn-excel span[id$="_btn-text"] { display: inline-flex; gap: .5rem; align-self: stretch; }
        .btn-excel i.fa-file-excel {
            order: -1; align-self: stretch;
            display: inline-flex; align-items: center;
            padding: .5rem 0 .5rem .85rem; font-size: 1.05rem;
        }

    </style>

        // ---------------------------------------------------
        // PREMIUM IOS/GMAIL STYLE NOTIFICATION BADGE FOR FAVICON & APP BADGING API
        // ---------------------------------------------------
        function setBrowserNotificationBadge(count) {
            // 1. Taskbar/Desktop Shortcut Badge (App Badging API)
            if ('setAppBadge' in navigator) {
                if (count > 0) {
                    navigator.setAppBadge(count).catch(err => console.error(err));
                } else {
                    navigator.clearAppBadge();
                }
            }

            // 2. Browser Tab Icon Badge (Favicon Canvas Drawing)
            const favicon = document.querySelector('link[rel="icon"]') || document.querySelector('link[rel="shortcut icon"]');
            if (!favicon) return;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = favicon.href;

            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 32;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');

                // Draw original favicon image
                ctx.drawImage(img, 0, 0, 32, 32);

                if (count > 0) {
                    const radius = 9;
                    const x = 32 - radius;
                    const y = radius;

                    // Draw white border ring
                    ctx.beginPath();
                    ctx.arc(x, y, radius + 1.5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();

                    // Draw iOS system red circle
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = '#FF3B30';
                    ctx.fill();

                    // Draw white bold count text
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const badgeText = count > 99 ? '99+' : count.toString();
                    ctx.fillText(badgeText, x, y);
                }

                favicon.href = canvas.toDataURL('image/png');
            };
        }

        $(document).ready(function() {
            const totalAlertCount = parseInt("{{ global_notification_badge_count|default:0 }}") || 0;
            setBrowserNotificationBadge(totalAlertCount);
            // แท็บบริษัท (#nav-tabs): ทุกช่องกว้างเท่ากัน ไม่เกิน 2 แถว
            // ถ้าจอกว้างพอให้ทุกแท็บกว้าง >= TAB_MIN_WIDTH ในแถวเดียว ใช้แถวเดียว ไม่งั้นแบ่งครึ่งเป็น 2 แถว
            const TAB_MIN_WIDTH = 110;
            function setCompanyTabCols() {
                const navTabs = document.getElementById('nav-tabs');
                if (!navTabs) return;
                const numTabs = navTabs.querySelectorAll('.nav-item').length;
                if (numTabs === 0) return;
                const cols = numTabs * TAB_MIN_WIDTH <= navTabs.clientWidth ? numTabs : Math.ceil(numTabs / 2);
                navTabs.style.setProperty('--tab-cols', cols);
            }
            setCompanyTabCols();
            $(window).on('resize', setCompanyTabCols);
        });

        // ---------------------------------------------------
        // Prevent mouse wheel from changing <input type="number"> values.
        // Delegated / global handler. Only blocks the wheel-driven value
        // change while the number field is focused; normal page scrolling,
        // typing, min/max/step, precision and validation are untouched.
        // Non-passive listener so preventDefault() is allowed here
        // (never use preventDefault in a passive wheel listener).
        // ---------------------------------------------------
        document.addEventListener('wheel', function (event) {
            var target = event.target;
            if (target instanceof HTMLInputElement &&
                target.type === 'number' &&
                target === document.activeElement) {
                event.preventDefault();
            }
        }, { passive: false });

    </script>
