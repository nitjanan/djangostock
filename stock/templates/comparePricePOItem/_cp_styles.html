<style>
  /* ---------- layout หน้าเพิ่ม/แก้ไขร้านค้าในใบเปรียบเทียบราคา ---------- */
  .cp-edit .cp-card {
    border: 1px solid #e3e6ea;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
  }
  .cp-edit .cp-card > .card-header {
    background: #f8f9fb;
    border-bottom: 1px solid #e3e6ea;
  }
  .cp-edit .cp-card > .card-header h5 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0;
  }
  .cp-edit .cp-card.cp-card-current {
    border: 2px solid #ffc107;
  }
  .cp-edit .cp-card.cp-card-current > .card-header {
    background: #fff8e1;
  }
  .cp-edit .cp-form-card.border-primary > .card-header {
    background: #e7f1ff;
  }
  .cp-edit .cp-form-card.border-warning > .card-header {
    background: #fff8e1;
  }

  /* ร้านค้าที่เพิ่มแล้ว */
  .cp-edit .cp-bidder-table {
    margin: 0;
    font-size: .92rem;
  }
  .cp-edit .cp-bidder-table thead th {
    border-top: 0;
    border-bottom: 2px solid #dee2e6;
    font-weight: 600;
    color: #495057;
    white-space: nowrap;
  }
  .cp-edit .cp-bidder-summary dt {
    font-weight: normal;
    color: #6c757d;
  }
  .cp-edit .cp-bidder-summary dt,
  .cp-edit .cp-bidder-summary dd {
    margin-bottom: .15rem;
  }
  .cp-edit .cp-bidder-summary .cp-grand {
    font-weight: 700;
    color: #0056b3;
  }

  /* ข้อมูลผู้จำหน่าย/เครดิต/ชนิดภาษีของร้านที่กำลังเพิ่ม/แก้ไข */
  /* หัวการ์ด: หัวข้อ | ผู้จำหน่าย | เครดิต | ชนิดภาษี | ปุ่ม อยู่แถวเดียว */
  .cp-edit .cp-head-grid {
    display: grid;
    grid-template-columns: auto minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    column-gap: 1rem;
    align-items: end;
  }
  .cp-edit .cp-head-title {
    margin: 0 0 .45rem;
    white-space: nowrap;
  }
  .cp-edit .cp-head-actions {
    display: flex;
    gap: .5rem;
    white-space: nowrap;
  }
  .cp-edit .cp-form-card > .card-header {
    padding: .6rem 1.25rem .75rem;
  }
  .cp-edit .cp-form-card > form > .card-body {
    padding-top: .75rem;
    padding-bottom: 1rem;
  }
  @media (max-width: 1199.98px) {
    .cp-edit .cp-head-grid {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr);
      row-gap: .5rem;
    }
    .cp-edit .cp-head-title {
      grid-column: 1 / -1;
      margin-bottom: 0;
    }
    .cp-edit .cp-head-actions {
      grid-column: 1 / -1;
      justify-content: flex-end;
    }
  }
  .cp-edit .cp-head-grid .form-group {
    margin-bottom: 0;
  }
  .cp-edit .cp-head-grid label {
    margin-bottom: .2rem;
    font-size: .9rem;
    color: #495057;
  }
  .cp-edit .select2-container .select2-selection--single,
  .cp-edit .select2-container .select2-dropdown {
    width: 100% !important;
  }
  /* span ว่างของ select2 ทำให้มีบรรทัดเกิน */
  .cp-edit .select2-container .dropdown-wrapper {
    display: none;
  }
  @media (max-width: 767.98px) {
    .cp-edit .cp-head-grid {
      grid-template-columns: minmax(0, 1fr);
      row-gap: .6rem;
    }
  }

  /* ตารางรายการสินค้า: หัวคอลัมน์กับช่องกรอกใช้ความกว้างชุดเดียวกัน */
  .cp-items-scroll {
    overflow-x: auto;
  }
  /* จอเล็กมากค่อยเลื่อนแนวนอน ไม่ให้ช่องแคบจนกรอกไม่ได้ */
  .cp-items {
    min-width: 820px;
  }
  .cp-items-head {
    display: flex;
    padding: .5rem 0;
    margin-bottom: .25rem;
    border-bottom: 2px solid #dee2e6;
    font-size: .85rem;
    font-weight: 600;
    color: #495057;
  }
  /* padding เท่ากับ input (.75rem + border 1px) หัวคอลัมน์จะตรงกับช่องกรอก */
  .cp-items-head > div {
    padding: 0 calc(.75rem + 1px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .cp-items-head > .c-no {
    padding: 0;
    text-align: center;
  }
  .cp-items .form-row {
    margin-left: 0;
    margin-right: 0;
  }
  .cp-items .form-row > [class^="col"] {
    padding: 0;
  }
  /* ความกว้างตามสัดส่วน (flex-grow) ให้ทั้งแถวพอดีความกว้างการ์ด ที่ และปุ่ม +/- กว้างคงที่ */
  .cp-items .input-group > .form-control,
  .cp-items .input-group > select {
    width: auto;
    min-width: 0;
  }
  .cp-items .c-no,
  .cp-items .input-group > .lb { flex: 0 0 40px; max-width: 40px; }
  .cp-items .c-code,
  .cp-items .input-group > .express { flex: 2.4 1 0; }
  .cp-items .c-desc,
  .cp-items .input-group > .description { flex: 2 1 0; }
  .cp-items .c-qty,
  .cp-items .input-group > .quantity { flex: 1 1 0; }
  .cp-items .c-unit,
  .cp-items .input-group > select[id$="-unit"] { flex: 1 1 0; }
  .cp-items .c-brand,
  .cp-items .input-group > input[id$="-brand"] { flex: 1.1 1 0; }
  .cp-items .c-uprice,
  .cp-items .input-group > .unit-price { flex: 1.3 1 0; }
  .cp-items .c-disc,
  .cp-items .input-group > .discount { flex: .9 1 0; }
  .cp-items .c-price,
  .cp-items .input-group > .price { flex: 1.3 1 0; }
  .cp-items .c-act,
  .cp-items .input-group > .input-group-append { flex: 0 0 40px; max-width: 40px; }
  .cp-items .input-group > .input-group-append .btn {
    width: 40px;
  }
  .cp-items .input-group > .lb {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f5;
    border: 1px solid #ced4da;
    border-right: 0;
    border-radius: .25rem 0 0 .25rem;
    font-weight: 600;
    color: #495057;
  }
  .cp-items .input-group > .description {
    resize: vertical;
    min-height: calc(2.25rem + 2px);
  }
  .cp-items .input-group > .price {
    font-weight: 600;
  }

  /* สรุปยอดเงิน */
  .cp-totals {
    background: #f8f9fb;
    border: 1px solid #e3e6ea;
    border-radius: 8px;
    padding: .5rem 1rem;
  }
  .cp-total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .1rem 0;
  }
  .cp-total-row label {
    margin: 0 1rem 0 0;
    font-size: .9rem;
    color: #495057;
  }
  .cp-total-row .form-control {
    flex: 0 0 170px;
    max-width: 170px;
    height: calc(1.5em + .5rem + 2px);
    padding: .25rem .5rem;
    font-size: .9rem;
  }
  .cp-total-grand {
    margin-top: .35rem;
    padding-top: .4rem;
    border-top: 2px solid #dee2e6;
  }
  .cp-total-grand .form-control {
    height: calc(1.5em + .75rem + 2px);
  }
  .cp-total-grand label {
    font-weight: 600;
    color: #212529;
  }
  .cp-total-grand .form-control {
    font-weight: 700;
    font-size: 1.1rem;
    color: #0056b3;
  }
  /* แถบปุ่มถัดไปติดด้านล่าง (แบบเดียวกับ po-actions หน้าแก้ไขใบสั่งซื้อ) */
  .cp-actions-bar {
    position: sticky;
    bottom: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    padding: .75rem 1rem;
    background: #fff;
    border-top: 1px solid #e3e6ea;
    box-shadow: 0 -2px 8px rgba(0, 0, 0, .05);
  }
  .cp-total-spell {
    text-align: right;
    font-size: .9rem;
    color: #6c757d;
    margin: .35rem 0 0;
  }
</style>
