{% comment %}modal เพิ่ม/แก้ไขรายการสินค้า (ใบขอเบิก / ใบขอซื้อ): ช่องค้นหารหัสวัสดุ (.rq-ps) และช่องเลือกหน่วย (.rq-unit) ใช้คู่กับ _rq_item_modal_js.html{% endcomment %}
<style>
/* modal เพิ่ม/แก้ไขรายการ: ขนาดใหญ่ อ่านง่าย */
/* bootstrap ของโปรเจกต์ยังไม่มี .modal-xl จึงกำหนดความกว้างเอง */
.rq-modal .modal-dialog { max-width: 1100px; width: calc(100% - 2rem); margin-left: auto; margin-right: auto; }
.rq-modal .modal-header { padding: 1rem 1.5rem; }
.rq-modal .modal-title { font-size: 1.35rem; }
.rq-modal .modal-body { padding: 1rem 1.5rem 1.25rem; }
.rq-modal .modal-footer { padding: .9rem 1.5rem; }
.rq-modal .modal-footer .btn { min-width: 120px; padding: .5rem 1.25rem; font-size: 1.05rem; }
.rq-modal .modal-body label {
  font-size: 1rem;
  font-weight: 600;
  margin: .9rem 0 .3rem;
}
.rq-modal .modal-body .form-control { height: 46px; font-size: 1.1rem; }
.rq-modal .modal-body .form-text { font-size: .85rem; }
/* ช่องค้นหารหัสวัสดุ/อุปกรณ์: ผลค้นหาแสดงค้างในหน้าต่าง (ไม่ใช้ dropdown) */
.rq-modal .rq-product-box {
  margin: .75rem 0 .5rem;
  padding: .6rem .75rem .7rem;
  background: #ecf8f0;
  border: 1px solid #b7e2c4;
  border-radius: 10px;
}
.rq-modal .modal-body .rq-product-box > label {
  margin: 0 0 .35rem;
  font-size: 1rem;
  font-weight: 700;
  color: #1e7e34;
}
.rq-ps-search { position: relative; }
.rq-ps-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 1rem; color: #28a745; pointer-events: none;
}
.rq-ps-q {
  display: block; width: 100%; height: 46px;
  padding: 0 120px 0 40px;
  font-size: 1.1rem;
  border: 2px solid #28a745; border-radius: 8px; background: #fff;
  transition: box-shadow .15s;
}
.rq-ps-q:focus { outline: none; box-shadow: 0 0 0 4px rgba(40, 167, 69, .25); }
.rq-ps-results mark { padding: 0 1px; background: #ffe58a; color: inherit; border-radius: 2px; }
.rq-ps-count {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font-size: .9rem; color: #3d6b4a; pointer-events: none;
}
/* แบบ B: เลือกแล้วแสดงเป็นการ์ดสินค้า ซ่อนช่องค้นหาไว้จนกว่าจะกด "เปลี่ยน" */
.rq-ps.is-picked .rq-ps-search,
.rq-ps.is-picked .rq-ps-results { display: none; }
.rq-ps-selected {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .75rem;
  padding: .45rem .75rem;
  background: #fff; border: 2px solid #28a745; border-radius: 10px;
}
.rq-ps-selected.d-none { display: none !important; }
.rq-ps-card-icon {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: #d4edda; color: #1e7e34; font-size: 1.1rem;
}
.rq-ps-card-code { font-size: 1.1rem; font-weight: 700; color: #155724; font-variant-numeric: tabular-nums; }
.rq-ps-card-code .rq-ps-unit { font-size: .85rem; font-weight: 400; margin-left: .4rem; vertical-align: middle; }
.rq-ps-card-name { font-size: .95rem; color: #343a40; line-height: 1.3; }
.rq-ps-change {
  padding: .3rem .75rem; border: 1px solid #28a745; border-radius: 6px; font-size: .9rem;
  background: #fff; color: #1e7e34; font-weight: 600; white-space: nowrap;
}
.rq-ps-change:hover { background: #e3f4e8; }
.rq-ps-cancel { display: none; margin-top: .5rem; padding: 0; border: 0; background: none; color: #6c757d; font-size: .9rem; text-decoration: underline; }
.rq-ps.has-value:not(.is-picked) .rq-ps-cancel { display: inline-block; }
.rq-ps-results:empty { display: none; }
.rq-ps-results {
  margin-top: .5rem; max-height: 300px; overflow-y: auto;
  background: #fff; border: 1px solid #b7e2c4; border-radius: 8px;
}
.rq-ps-empty { padding: .9rem 1rem; color: #6c757d; font-size: .95rem; }
.rq-ps-row {
  display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; align-items: center; gap: .75rem;
  padding: .45rem .85rem; border-bottom: 1px solid #eef3ef; cursor: pointer; font-size: .95rem;
}
.rq-ps-row:hover, .rq-ps-row.is-active { background: #e3f4e8; }
.rq-ps-row.is-selected { background: #d4edda; box-shadow: inset 4px 0 0 #28a745; }
.rq-ps-code { font-weight: 700; font-variant-numeric: tabular-nums; color: #155724; }
.rq-ps-name { color: #343a40; }
.ps-similar { display: inline-block; margin-left: .4rem; font-size: .75rem; padding: 0 .4rem; border-radius: 3px; background: #fff3e0; color: #c25e00; border: 1px solid #ffcc80; white-space: nowrap; vertical-align: middle; }
.rq-ps-unit { font-size: .8rem; padding: .05rem .5rem; border-radius: 3px; background: #eef1f4; color: #495057; white-space: nowrap; }
.rq-ps-row .rq-ps-check { color: #28a745; margin-left: .35rem; visibility: hidden; }
.rq-ps-row.is-selected .rq-ps-check { visibility: visible; }
.rq-ps-more { display: block; width: 100%; padding: .55rem; border: 0; background: #f6fbf7; color: #1e7e34; font-weight: 600; }
.rq-ps-more:hover { background: #e3f4e8; }
/* ช่องหน่วย: คลิกแล้วแสดงหน่วยทั้งหมดเป็นปุ่ม พิมพ์เพื่อกรอง */
.rq-unit { position: relative; }
.rq-modal .modal-body .rq-unit-q { padding-right: 2.2rem; }
.rq-unit-caret { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #6c757d; pointer-events: none; }
.rq-unit-list {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 1060;
  display: flex; flex-wrap: wrap; gap: .35rem;
  max-height: 230px; overflow-y: auto; padding: .5rem;
  background: #fff; border: 1px solid #ced4da; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
}
.rq-unit-list.d-none { display: none !important; }
.rq-unit-opt { padding: .3rem .75rem; border: 1px solid #dee2e6; border-radius: 6px; background: #f8f9fa; color: #343a40; font-size: 1rem; line-height: 1.4; }
.rq-unit-opt:hover, .rq-unit-opt.is-active { background: #e3f4e8; border-color: #28a745; }
.rq-unit-opt.is-current { background: #28a745; border-color: #28a745; color: #fff; }
.rq-unit-empty { padding: .25rem .4rem; color: #6c757d; font-size: .95rem; }
@media screen and (max-width: 767.98px) {
  .rq-ps-q { padding-right: 12px; font-size: 1rem; }
  .rq-ps-count { display: none; }
  .rq-ps-row { grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .5rem; }
  .rq-ps-row .rq-ps-name { grid-column: 1 / -1; grid-row: 2; font-size: .9rem; }
  .rq-ps-selected { grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; padding: .45rem .6rem; }
  .rq-ps-card-icon { display: none; }
  .rq-ps-card-code { font-size: 1.05rem; }
  .rq-ps-card-name { font-size: .9rem; }
}
</style>
