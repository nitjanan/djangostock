{# CSS แท็ป กำลังดำเนินการ / แบบร่าง ใช้คู่กับ _draft_tabs.html (ใส่ใน block css) #}
<style>
  /* แท็ป กำลังดำเนินการ / แบบร่าง */
  .cp-tab-header {
    background: #eef1f6;
    border-bottom: 1px solid #dfe3ea;
    padding: .5rem 1rem 0;
  }
  .cp-tabs {
    display: flex;
    gap: .5rem;
  }
  .cp-tab {
    --accent: #1d6fdc;
    --accent-soft: #e3eefc;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    padding: .45rem 1.1rem .5rem;
    margin-bottom: -1px;
    color: #5f6b7a;
    font-weight: 600;
    border: 1px solid transparent;
    border-bottom: none;
    border-radius: .6rem .6rem 0 0;
    transition: background-color .15s ease, color .15s ease;
  }
  .cp-tab-draft {
    --accent: #d97a00;
    --accent-soft: #fdf0dc;
  }
  .cp-tab:hover {
    color: var(--accent);
    background: rgba(255, 255, 255, .6);
    text-decoration: none;
  }
  .cp-tab-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: #dde2ea;
    color: #6c7786;
    font-size: .75rem;
    transition: background-color .15s ease, color .15s ease;
  }
  .cp-tab:hover .cp-tab-icon {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .cp-tab-label {
    font-size: 1.05rem;
    white-space: nowrap;
  }
  .cp-tab-count {
    min-width: 1.9rem;
    padding: .1rem .55rem;
    border-radius: 1rem;
    background: #dde2ea;
    color: #5f6b7a;
    font-size: .85rem;
    font-weight: 700;
    text-align: center;
    white-space: nowrap;
  }
  .cp-tab.is-active {
    color: var(--accent);
    background: #fff;
    border-color: #dfe3ea;
    box-shadow: 0 -3px 10px rgba(30, 45, 70, .06);
  }
  .cp-tab.is-active::before {
    content: "";
    position: absolute;
    top: -1px;
    left: -1px;
    right: -1px;
    height: 4px;
    border-radius: .6rem .6rem 0 0;
    background: var(--accent);
  }
  .cp-tab.is-active .cp-tab-icon,
  .cp-tab.is-active .cp-tab-count {
    background: var(--accent);
    color: #fff;
  }
  @media (max-width: 575.98px) {
    .cp-tab-header { padding: .5rem .5rem 0; }
    .cp-tabs { gap: .25rem; }
    .cp-tab {
      flex: 1 1 0;
      justify-content: center;
      gap: .4rem;
      padding: .4rem .5rem .45rem;
    }
    .cp-tab-icon { display: none; }
    .cp-tab-label { font-size: .95rem; }
  }
  @media (max-width: 359.98px) {
    .cp-tab { padding: .4rem .35rem .45rem; gap: .3rem; }
    .cp-tab-label { font-size: .85rem; }
    .cp-tab-count { min-width: 1.5rem; padding: .05rem .4rem; font-size: .75rem; }
  }
</style>
